name: security-action
on:
  push:
    branches: [feature-ejs]

jobs:
  build:
    runs-on: ubuntu-latest
    name: build docker image
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: false
          tags: nodegoat:latest

  veracode_iac_secrets-scan:
    runs-on: ubuntu-latest
    name: veracode container scan
    needs: [build]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: veracode container scan
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VKEY }}
        uses: veracode/container_iac_secrets_scanning@v1.0.1
        with:
          vid: ${{ secrets.VERACODE_API_KEY_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY_SECRET }}
          command: "scan" 
          type: "directory"
          source: "${{ secrets.DOCKERHUB_USERNAME }}/nodegoat:latest"
          format: "image"
          debug: false
          fail_build: false

